global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "retro_api"
    metrics_path: /metrics
    dns_sd_configs:
    - names: ["retro_video_game_exchange"]
      type: A
      port: 8000
      refresh_interval: 10s

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx_exporter:9113"]

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka_exporter:9308"]
      
  - job_name: "notifier"
    static_configs:
      - targets: ["notifier:8001"]

  - job_name: "mongo_exporter"
    static_configs:
      - targets: ["mongo_exporter:9216"]
