services:
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - retro_video_game_exchange
    ports:
      - "8000:80"
    networks:
      - distributed_system

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - distributed_system

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command:
      - "-nginx.scrape-uri=http://nginx/stub_status"
    depends_on:
      - nginx
    networks:
      - distributed_system

  kafka_exporter:
    image: danielqsj/kafka-exporter:latest
    command:
    - "--kafka.server=kafka:29092"
    depends_on:
    - kafka
    ports:
    - "9308:9308"
    networks:
    - distributed_system

  retro_video_game_exchange:
    build:
      context: ./Retro-Video-Game-Exchange-RMM3-API-
      dockerfile: Dockerfile
    env_file:
      - ./Retro-Video-Game-Exchange-RMM3-API-/.env
    ports:
      - "8000"
    depends_on:
      - kafka
    networks:
      - distributed_system

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - distributed_system

  mongo_exporter:
    image: percona/mongodb_exporter:0.39
    env_file:
      - ./.env
    command:
      - "--mongodb.uri=${MONGO_EXPORTER_URI}"
      - "--no-mongodb.direct-connect"
      - "--web.listen-address=:9216"
      - "--collect-all"
      - "--compatible-mode"
    ports:
      - "9216:9216"
    networks:
      - distributed_system

  kafka:
    image: confluentinc/cp-kafka:latest
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"     # host access (localhost:9092)
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    networks:
      - distributed_system

  notifier:
    build:
      context: ./notifier
      dockerfile: Dockerfile
    env_file:
      - ./notifier/.env
    depends_on:
      - kafka
    ports:
      - "8001:8001"
    networks:
      - distributed_system

networks:
  distributed_system:
# The Kafka, exporters, and notifier portions were generated by ChatGPT